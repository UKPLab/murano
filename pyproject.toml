[project]
name = "murano"
dynamic = ["version"]
description = "Mechanistic interpretability pipelines for recording, steering, probing, and evaluation"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "nnsight>=0.4.8",
    "torch>=2.7.1",
    "transformers>=4.46,<5.0",
    "huggingface-hub>=0.23.0",
    "datasets>=4.0.0",
    "scikit-learn>=1.5.0",
    "tqdm>=4.66.0",
]

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["src/murano"]


[dependency-groups]
dev = [
    "pyright>=1.1.391",
    "pytest>=8.3.4",
    "pytest-cov>=4.1.0",
    "ruff>=0.8.5",
]

[project.optional-dependencies]
plot = [
    "matplotlib>=3.9",
    "seaborn>=0.13",
]

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
bump = true

[tool.coverage.run]
source = ["examples", "src"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/build/*",
    "*/dist/*",
    "setup.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
show_missing = true
skip_covered = false
precision = 2

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
