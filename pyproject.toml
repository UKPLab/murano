[project]
name = "murano-interp"
dynamic = ["version"]
description = "Mechanistic interpretability pipelines for recording, steering, probing, and evaluation"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE.txt"]
authors = [{ name = "UKP Lab, Technische Universität Darmstadt" }]
maintainers = [{ name = "UKP Lab, Technische Universität Darmstadt" }]
keywords = [
    "mechanistic-interpretability",
    "interpretability",
    "transformers",
    "activation-patching",
    "steering",
    "sparse-autoencoders",
    "probing",
    "nnsight",
    "llm",
    "pytorch",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    "nnsight>=0.4.8",
    "nnterp>=1.2.2,<2.0",
    "torch>=2.7.1",
    "transformers>=4.57.6,<5.0",
    "huggingface-hub>=0.23.0",
    "tqdm>=4.66.0",
]

[project.urls]
Homepage = "https://github.com/UKPLab/murano"
Documentation = "https://ukplab.github.io/murano/"
Repository = "https://github.com/UKPLab/murano"
Issues = "https://github.com/UKPLab/murano/issues"
Changelog = "https://github.com/UKPLab/murano/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["src/murano"]

[tool.hatch.build.targets.sdist]
# Ship only what is needed to build and understand the package; keep the docs
# site (and its node_modules) and the notebooks out of the PyPI source
# distribution. exclude takes precedence, so this also drops the nested
# node_modules that the docs .gitignore hides but the sdist builder does not.
exclude = [
    "/.codex",
    "/.omx",
    "/AGENTS.md",
    "/docs",
    "/notebooks",
    "/tasks",
    "**/node_modules",
]


[dependency-groups]
dev = [
    "pyright>=1.1.391",
    "pytest>=8.3.4",
    "pytest-cov>=4.1.0",
    "ruff>=0.8.5",
    "protobuf>=5.29.0",
    "sentencepiece>=0.2.1",
    "griffe>=1.0",
]

[project.optional-dependencies]
# Each extra maps to one use case. The import names behind these packages are
# registered in murano._optional so missing-dependency errors point users at
# the right extra. When adding a new application, add its extra here, list it
# in `all`, and register its import names in murano._optional.EXTRA_IMPORTS.
probe = [
    "scikit-learn>=1.5.2",
]
data = [
    "datasets>=4.0.0",
]
plot = [
    "plotly>=6.7.0",
    # kaleido 0.2.1 ships a self-contained Chromium, so PNG/SVG export works on
    # headless nodes (Slurm, CI) without a system Chrome (which kaleido>=1
    # needs). Pinned exactly: the 0.2.1.post1 release only published an armv7l
    # wheel, so a "<1" range fails to install on x86_64.
    "kaleido==0.2.1",
]
sae = [
    "sae-lens>=6.7.0",
]
notebook = [
    "jupyter>=1.1",
    "ipykernel>=6.29",
    "nltk>=3.9.4",
]
all = [
    "murano-interp[probe,data,plot,sae,notebook]",
]

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
bump = true

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/build/*",
    "*/dist/*",
    "setup.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
show_missing = true
skip_covered = false
precision = 2

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
